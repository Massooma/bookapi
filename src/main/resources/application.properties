spring.application.name=bookapi

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:file:./data/bookdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.config.import=optional:file:secrets/elasticsearch.properties
spring.elasticsearch.uris=https://localhost:9200
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD}

spring.ssl.bundle.pem.elasticsearch.truststore.certificate=C:/elasticsearch/elasticsearch-8.18.1/config/certs/http_ca.crt
spring.elasticsearch.restclient.ssl.bundle=elasticsearch